[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-stt-pipeline"
version = "0.1.0"
description = "Speech-to-text pipeline for call recordings with sales-call quality scoring"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
